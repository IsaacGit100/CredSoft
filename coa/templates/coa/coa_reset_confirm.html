<!DOCTYPE html>
<html>
<head>
    <title>Reset Chart of Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4>⚠️ Reset Chart of Accounts</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-warning">
                            <strong>Warning!</strong> This will delete ALL accounts and cannot be undone.
                        </div>
                        
                        <p>Type <strong>RESET</strong> to confirm:</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <input type="text" name="confirm" class="form-control mb-3" 
                                   placeholder="Type RESET here" required>
                            <button type="submit" class="btn btn-danger">Reset All Accounts</button>
                            <a href="{% url 'coa:coa_list' %}" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
