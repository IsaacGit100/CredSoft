{% if current_entity %}
    <div class="ctx-banner">
        <i class="fas fa-church"></i>
        <span>You are viewing:</span>
        <strong>{{ current_entity.name }}</strong>
        <a href="{% url 'Consolidated:select_context' %}" class="ctx-change">
            <i class="fas fa-exchange-alt"></i> Change
        </a>
    </div>
{% elif consolidated_mode %}
    <div class="ctx-banner ctx-banner-all">
        <i class="fas fa-layer-group"></i>
        <span>You are viewing:</span>
        <strong>All Parishes (Consolidated)</strong>
        <a href="{% url 'Consolidated:select_context' %}" class="ctx-change">
            <i class="fas fa-exchange-alt"></i> Change
        </a>
    </div>
{% endif %}
