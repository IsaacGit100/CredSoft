<!-- templates/users/profile.html -->
<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>My Profile</h4>
                    </div>
                    <div class="card-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                        
                        <form method="post">
                            {% csrf_token %}
                            
                            <h5 class="mb-3">Basic Information</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" value="{{ user.username }}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Role</label>
                                    <input type="text" class="form-control" value="{{ user.profile.get_role_display }}" readonly>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ user.email }}">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control" value="{{ user.profile.phone }}">
                            </div>
                            
                            <hr>
                            <h5 class="mb-3">Preferences</h5>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Theme</label>
                                    <select name="theme" class="form-control">
                                        <option value="light" {% if user.profile.theme == 'light' %}selected{% endif %}>Light</option>
                                        <option value="dark" {% if user.profile.theme == 'dark' %}selected{% endif %}>Dark</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Items Per Page</label>
                                    <input type="number" name="items_per_page" class="form-control" value="{{ user.profile.items_per_page }}">
                                </div>
                            </div>

                            <!-- templates/users/profile.html -->
                                {% if user.profile %}
                                    <div class="mb-3">
                                        <label>Role</label>
                                        <input type="text" value="{{ user.profile.get_role_display }}" readonly>
                                    </div>
                                {% else %}
                                    <div class="alert alert-warning">
                                        Profile not found. Please contact administrator.
                                    </div>
                                {% endif %}
                            
                            <hr>
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'userauth:change_password' %}" class="btn btn-warning">Change Password</a>
                                <div>
                                    <a href="{% url 'userauth:dashboard' %}" class="btn btn-secondary">Back</a>
                                    <button type="submit" class="btn btn-primary">Save Changes</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
