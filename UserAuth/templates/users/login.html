<!DOCTYPE html>
<html>
<head>
    <title>Login - Credit Union</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-card {
            background: white;
            padding: 35px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .login-card h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }
        
        .datetime {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #2a5298;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #1e3c72;
        }
        
        .forgot {
            text-align: center;
            margin-top: 15px;
        }
        
        .forgot a {
            color: #888;
            font-size: 12px;
            text-decoration: none;
        }
        
        .forgot a:hover {
            color: #2a5298;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3>Credit Union Management Software</h3>
        
        <div class="datetime" id="currentDate"></div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="input-group">
                <label>UserName</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit">Login</button>
           
            
            <div class="forgot">
                <a href="#">Forget Password?</a>
            </div>
        </form>
        
        <div class="footer">
            Powered By: Hi-Waves Ventures
        </div>
    </div>
    
    <script>
        function showDateTime() {
            const now = new Date();
            const date = now.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            const time = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            document.getElementById('currentDate').innerHTML = `${date} | ${time}`;
        }
        showDateTime();
        setInterval(showDateTime, 60000);
    </script>
</body>
</html>
