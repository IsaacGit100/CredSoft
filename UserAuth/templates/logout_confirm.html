<!-- templates/UserAuth/logout_confirm.html -->

{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-sign-out-alt"></i> Confirm Logout
                    </h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-question-circle fa-4x text-warning mb-3"></i>
                    <p class="lead">Are you sure you want to logout?</p>
                    <p class="text-muted">You will need to login again to access your account.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-center">
                            <a href="{% url 'tech_dashboard' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-sign-out-alt"></i> Yes, Logout
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
