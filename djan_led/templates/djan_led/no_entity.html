{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 50px;">
    <div class="card">
        <div class="card-header bg-warning text-white">
            <h3> No Entity Assigned</h3>
        </div>
        <div class="card-body">
            <p>{{ message|default:"You have not been assigned to any entity yet." }}</p>
            <p>Please contact your system administrator to assign you to a church, school, or credit union.</p>
            <a href="{% url 'djan_led:djan_led_home' %}" class="btn btn-secondary">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
