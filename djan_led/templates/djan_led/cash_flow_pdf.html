<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Cash Flow</title>
<style>body{font-family:Arial;font-size:12px;margin:40px;background:white;color:black;}
.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:18px;margin:0;}
.header p{margin:2px 0;color:#555;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
th{background:#f0f0f0;font-weight:bold;}
.text-right{text-align:right;}
.total-row{font-weight:bold;background:#f9f9f9;}
.footer{margin-top:30px;font-size:10px;text-align:center;color:#999;}
</style>
</head>
<body>
<div class="header"><h1>Cash Flow Statement</h1><p>{{ entity.name }}</p><p>Generated: {{ date|date:"Y-m-d H:i" }}</p></div>
<table>
<thead><tr><th>Category</th><th class="text-right">Amount</th></tr></thead>
<tbody>
<tr><td>Cash Inflows</td><td class="text-right">{{ inflows|floatformat:2 }}</td></tr>
<tr><td>Cash Outflows</td><td class="text-right">{{ outflows|floatformat:2 }}</td></tr>
<tr class="total-row"><td><strong>Net Cash Flow</strong></td><td class="text-right"><strong>{{ net|floatformat:2 }}</strong></td></tr>
</tbody>
</table>
<div class="footer">Generated by CredSoft – {{ date|date:"Y-m-d" }}</div>
</body>
</html>
