{% extends "base.html" %}

{% block content %}
<div class="d-flex">
    {% include "djan_led/sidebars/finance_sidebar.html" %}
    <div class="flex-grow-1 p-4" style="margin-left: 250px; background: #f8f9fa; min-height: 100vh;">
        <h2>📝 Create Manual Journal Entry</h2>
        <p><strong>Entity:</strong> {{ entity.name }}</p>
        <form method="post" class="card p-4 shadow-sm" style="max-width: 600px;">
            {% csrf_token %}
            <!-- same fields as before -->
            <button type="submit" class="btn btn-primary">Save as Draft</button>
            <a href="{% url 'djan_led:manual_journal_entry_list' entity.slug %}" class="btn btn-secondary">View Drafts</a>
        </form>
    </div>
</div>
{% endblock %}
