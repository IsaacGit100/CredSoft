{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 50px;">
    <h1>💰 Record Offering</h1>
    <p><strong>Entity:</strong> {{ entity.name }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">✅ Record Offering</button>
        <a href="{% url 'djan_led:entity_dashboard' entity.slug %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
