{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar (optional) -->
        <div class="col-md-3 col-lg-2 d-md-block bg-light sidebar" style="min-height: 100vh; padding-top: 20px; border-right: 1px solid #ddd;">
            <div class="position-sticky">
                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                    <span>Finance</span>
                </h6>
                <div class="list-group">
                    <a href="{% url 'djan_led:entity_dashboard' entity.slug %}?module=finance" class="list-group-item list-group-item-action">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a href="{% url 'RecPayApp:finance_trans_create' entity.slug %}" class="list-group-item list-group-item-action active">
                        <i class="fas fa-plus-circle"></i> New Transaction
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" style="background-color: #f8f9fa; min-height: 100vh; padding-top: 20px;">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">💰 Finance Transaction Entry</h1>
                <span class="text-muted">{{ entity.name }}</span>
            </div>

            <form method="post" id="trans-form">
                {% csrf_token %}

                <!-- Transaction Details -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Transaction Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <label for="date" class="form-label">Date</label>
                                <input type="text" name="date" id="date" class="form-control" value="{{ today|date:'d/m/Y' }}" placeholder="DD/MM/YYYY" required>
                            </div>
                            <div class="col-md-3">
                                <label for="trans_no" class="form-label">Transaction No.</label>
                                <input type="text" name="trans_no" id="trans_no" class="form-control" value="{{ next_trans_no|default:'' }}" placeholder="Auto">
                            </div>
                            <div class="col-md-3">
                                <label for="trans_type" class="form-label">Type</label>
                                <select name="trans_type" id="trans_type" class="form-select" required>
                                    <option value="">-- Select --</option>
                                    <option value="Receipts">Receipt</option>
                                    <option value="Payments">Payment</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="amount" class="form-label">Amount</label>
                                <input type="text" name="amount" id="amount" class="form-control" step="0.01" required>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label for="chart_account" class="form-label">Account</label>
                                <select name="chart_account" id="chart_account" class="form-select" required>
                                    <option value="">-- Select Account --</option>
                                    {% for acc in accounts %}
                                        <option value="{{ acc.id }},{{ acc.code }},{{ acc.name }}">
                                            {{ acc.code }} - {{ acc.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="pay_mode" class="form-label">Payment Mode</label>
                                <select name="pay_mode" id="pay_mode" class="form-select" required>
                                    <option value="">-- Select --</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Cheque">Cheque</option>
                                    <option value="Transfer">Bank Transfer</option>
                                    <option value="Momo">Mobile Money</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-12">
                                <label for="details" class="form-label">Description / Payee</label>
                                <input type="text" name="details" id="details" class="form-control" placeholder="e.g., Office rent payment">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Payment Details (conditional) -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Payment Details</h5>
                    </div>
                    <div class="card-body" id="payment-details">
                        <!-- Cheque Fields -->
                        <div class="row cheque-fields" style="display: none;">
                            <div class="col-md-4">
                                <label for="cheque_no" class="form-label">Cheque No.</label>
                                <input type="text" name="cheque_no" id="cheque_no" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="cheque_date" class="form-label">Cheque Date</label>
                                <input type="text" name="cheque_date" id="cheque_date" class="form-control" placeholder="DD/MM/YYYY">
                            </div>
                            <div class="col-md-4">
                                <label for="bank" class="form-label">Bank</label>
                                <input type="text" name="bank" id="bank" class="form-control">
                            </div>
                        </div>

                        <!-- Transfer Fields -->
                        <div class="row transfer-fields" style="display: none;">
                            <div class="col-md-4">
                                <label for="momo_no" class="form-label">Mobile Money Number</label>
                                <input type="text" name="momo_no" id="momo_no" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="momo_name" class="form-label">Mobile Money Name</label>
                                <input type="text" name="momo_name" id="momo_name" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="bank_branch" class="form-label">Bank Branch</label>
                                <input type="text" name="bank_branch" id="bank_branch" class="form-control">
                            </div>
                        </div>

                        <!-- Cash: no extra fields -->
                        <p class="text-muted cash-fields" style="display: none;">No additional details for Cash.</p>
                    </div>
                </div>

                <!-- Submit Buttons -->
                <div class="mt-3">
                    <button type="submit" name="save" class="btn btn-success">💾 Save Transaction</button>
                    <button type="submit" name="close" class="btn btn-secondary">✖ Close</button>
                    <a href="{% url 'djan_led:entity_dashboard' entity.slug %}?module=finance" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </div>
</div>

<!-- JavaScript (same as church template) -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const payMode = document.getElementById('pay_mode');
    const chequeFields = document.querySelector('.cheque-fields');
    const transferFields = document.querySelector('.transfer-fields');
    const cashFields = document.querySelector('.cash-fields');

    function togglePaymentFields() {
        const mode = payMode.value;
        chequeFields.style.display = 'none';
        transferFields.style.display = 'none';
        cashFields.style.display = 'none';
        if (mode === 'Cheque') {
            chequeFields.style.display = 'flex';
        } else if (mode === 'Transfer' || mode === 'Momo') {
            transferFields.style.display = 'flex';
        } else if (mode === 'Cash') {
            cashFields.style.display = 'block';
        }
    }
    payMode.addEventListener('change', togglePaymentFields);
    togglePaymentFields();

    // Format amount with commas
    const amountField = document.getElementById('amount');
    amountField.addEventListener('blur', function() {
        let raw = this.value.replace(/,/g, '').trim();
        if (raw && !isNaN(raw) && parseFloat(raw) >= 0) {
            let num = parseFloat(raw);
            this.value = num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
    });
    amountField.addEventListener('focus', function() {
        this.value = this.value.replace(/,/g, '');
    });

    // Prevent double submission
    document.getElementById('trans-form').addEventListener('submit', function() {
        document.querySelector('button[name="save"]').disabled = true;
        document.querySelector('button[name="save"]').textContent = 'Saving...';
    });
});
</script>
{% endblock %}
