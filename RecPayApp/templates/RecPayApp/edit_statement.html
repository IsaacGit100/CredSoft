<!DOCTYPE html>
<html>
<head>
{% load humanize %}
<title>Edit Statement</title>
<style>
body { background-color: #E6F0FA; font-family: Arial; }
.form-container { max-width: 600px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
.buttons { margin-top: 20px; }
.btn-update { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
.btn-delete { background-color: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
.btn-cancel { background-color: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<div class="form-container">
    <h3>Edit Statement for {{ master.name }}</h3>
    
    {% if messages %}
        {% for message in messages %}
            <div style="background-color: {% if message.tags == 'error' %}#ffebee{% else %}#e8f5e8{% endif %}; 
                       border: 1px solid {% if message.tags == 'error' %}#f44336{% else %}#4caf50{% endif %}; 
                       padding: 10px; margin-bottom: 15px; border-radius: 8px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Date:</label>
            <input type="text" name="date" value="{{ statement.date|date:'d/m/Y' }}" 
                   placeholder="dd/mm/yyyy" required>
        </div>
        
        <div class="form-group">
            <label>Receipt No:</label>
            <input type="text" name="rec_no" value="{{ statement.rec_no }}" required>
        </div>
        
        <div class="form-group">
            <label>Dr/Cr:</label>
            <select name="trans_type" required>
                <option value="Dr" {% if statement.trans_type == 'Dr' %}selected{% endif %}>Dr</option>
                <option value="Cr" {% if statement.trans_type == 'Cr' %}selected{% endif %}>Cr</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>State Code:</label>
            <select name="state_code" required>
                <option value="Savings Interest" {% if statement.state_code == 'Savings Interest' %}selected{% endif %}>Savings Interest</option>
                <option value="Savings" {% if statement.state_code == 'Savings' %}selected{% endif %}>Savings</option>
                <option value="Withdrawals" {% if statement.state_code == 'Withdrawals' %}selected{% endif %}>Withdrawals</option>
                <option value="Loans Disbursement" {% if statement.state_code == 'Loans Disbursement' %}selected{% endif %}>Loans Disbursement</option>
                <option value="Loan Repayment" {% if statement.state_code == 'Loan Repayment' %}selected{% endif %}>Loan Repayment</option>
                <option value="Loan Interest" {% if statement.state_code == 'Loan Interest' %}selected{% endif %}>Loan Interest</option>
                <option value="Shares" {% if statement.state_code == 'Shares' %}selected{% endif %}>Shares</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Amount:</label>
            <input type="number" name="amount" value="{{ statement.amount }}" step="0.01" required>
        </div>
        
        <div class="buttons">
            <button type="submit" name="update" class="btn-update">Update Record</button>
            <button type="submit" name="delete" class="btn-delete" 
                    onclick="return confirm('Are you sure you want to delete this record?')">Delete Record</button>
            <a href="{% url 'StateApp:add_statement' master.id %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
