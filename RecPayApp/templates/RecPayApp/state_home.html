<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Sub-menu</title>
    <style>
        /* Method 1: Flexbox Container */
        .container {
            display: flex;
            justify-content: center;  /* Horizontal centering */
            align-items: center;      /* Vertical centering */
            min-height: 100vh;        /* Full viewport height */
        }

        /* Blue Sub-menu Styles */
        .blue-submenu {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.2);
            max-width: 300px;
            width: 100%; /* Makes it responsive */
        }

        .blue-submenu h3 {
            color: #1565c0;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #64b5f6;
            font-size: 18px;
            text-align: center;
        }

        .blue-submenu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .blue-submenu li {
            margin-bottom: 8px;
        }

        .blue-submenu a {
            display: block;
            padding: 10px 15px;
            background-color: #2196f3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .blue-submenu a:hover {
            background-color: #1976d2;
            transform: translateX(5px);
            box-shadow: 0 3px 8px rgba(25, 118, 210, 0.4);
        }

        .blue-submenu a:active {
            background-color: #0d47a1;
            transform: translateX(2px);
        }

        .blue-submenu a::before {
            content: "▶";
            margin-right: 8px;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Method 1: Using Flexbox -->
    <div class="container">
        <div class="blue-submenu">
            <h2>St. Andrews Credit Union</h2>
            <h3>Loans Application Menu</h3>
            <ul>
                <li><a href="{% url 'StateApp:search_master' %}">Enter Statement For Records</a></li>
                <li><a href="{#}">Manage Member Records</a></li>
               
            
                <li><a href="{#}">Export to Excel</a></li>
                <li><a href="{#}">Generate PDF List</a></li>
                <li><a href="{% url 'HomeApp:home' %}">Exit</a><li>
            </ul>
        </div>
        <!-- Add to your master_list.html template -->
<div class="d-flex gap-2 mb-3 flex-wrap">
</div>
    </div>
</body>
</html>
