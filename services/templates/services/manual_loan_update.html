{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Run Daily Loan Update</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-warning">Run Update Now</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
