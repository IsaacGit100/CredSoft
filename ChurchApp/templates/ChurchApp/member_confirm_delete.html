{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Confirm Soft Delete</h2>
    <p>Are you sure you want to delete <strong>{{ member.full_name }}</strong>?</p>
    <p class="text-muted">This record will be hidden but not permanently removed.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'ChurchApp:member_list_manage' entity.slug %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
