{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-danger text-white">
            Confirm Delete
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete <strong>{{ clergy.full_name }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'ChurchApp:clergy_list_manage' entity.slug %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
