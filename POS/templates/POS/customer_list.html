{% extends "base.html" %}

{% block content %}
<div class="d-flex">
    {% include "pos/sidebar.html" %}
    <div class="flex-grow-1 p-4" style="margin-left: 250px; background: #f4f7fa; min-height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>👥 Customers</h2>
            <a href="{% url 'pos:customer_add' entity.slug %}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add Customer
            </a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for customer in customers %}
                            <tr>
                                <td>{{ customer.name }}</td>
                                <td>{{ customer.phone }}</td>
                                <td>{{ customer.email }}</td>
                                <td>
                                    <a href="{% url 'pos:customer_edit' entity.slug customer.id %}" class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a href="{% url 'pos:customer_delete' entity.slug customer.id %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this customer?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr><td colspan="4" class="text-center">No customers found.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
