{% extends "base.html" %}

{% block content %}
<div class="d-flex">
    {% include "pos/sidebar.html" %}
    <div class="flex-grow-1 p-4" style="margin-left: 250px; background: #f4f7fa; min-height: 100vh;">
        <h2>💰 Debtors</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Outstanding Balance</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for item in debtor_data %}
                            <tr>
                                <td>{{ item.customer.name }}</td>
                                <td>{{ item.balance|floatformat:2 }}</td>
                            </tr>
                            {% empty %}
                            <tr><td colspan="2" class="text-center">No debtors.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
