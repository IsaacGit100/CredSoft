<!-- help_module/templates/help_module/help_modal.html -->
<!-- Floating Help Button -->
<div id="helpButton" style="position: fixed; bottom: 30px; right: 30px; z-index: 1000;">
    <button class="btn btn-primary rounded-circle p-3 shadow" onclick="toggleHelpModal()" style="width: 60px; height: 60px;">
        <i class="fas fa-question fa-2x"></i>
    </button>
</div>

<!-- Help Modal -->
<div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="helpModalLabel">
                    <i class="fas fa-life-ring me-2"></i>Help Center
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-4">
                        <div class="list-group" id="helpTopicsList">
                            <a href="#" class="list-group-item list-group-item-action active" data-topic="general">
                                <i class="fas fa-info-circle me-2"></i>General Help
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="members">
                                <i class="fas fa-users me-2"></i>Members
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="loans">
                                <i class="fas fa-hand-holding-usd me-2"></i>Loans
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="finance">
                                <i class="fas fa-chart-line me-2"></i>Finance
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="investments">
                                <i class="fas fa-chart-pie me-2"></i>Investments
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="system">
                                <i class="fas fa-cogs me-2"></i>System Setup
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="users">
                                <i class="fas fa-user-shield me-2"></i>Users
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="accounts">
                                <i class="fas fa-book me-2"></i>Chart of Accounts
                            </a>
                            <a href="#" class="list-group-item list-group-item-action" data-topic="payments">
                                <i class="fas fa-money-bill-wave me-2"></i>Receipts & Payments
                            </a>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div id="helpContent">
                            <div class="text-center py-5">
                                <i class="fas fa-question-circle fa-4x text-muted mb-3"></i>
                                <h5>How can we help you?</h5>
                                <p class="text-muted">Select a topic above or use the search bar to find help articles.</p>
                                <form action="/help/search/" method="get" class="mt-3">
                                    <div class="input-group">
                                        <input type="text" class="form-control" name="q" placeholder="Search for help..." required>
                                        <button class="btn btn-primary" type="submit">
                                            <i class="fas fa-search"></i> Search
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="w-100">
                    <small class="text-muted">
                        <i class="fas fa-envelope me-1"></i> Need more help? 
                        <a href="/contact/" class="text-decoration-none">Contact Support</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function toggleHelpModal() {
    const modalElement = document.getElementById('helpModal');
    if (modalElement) {
        const modal = new bootstrap.Modal(modalElement);
        modal.show();
    }
}

// Load help content dynamically
document.addEventListener('DOMContentLoaded', function() {
    const helpLinks = document.querySelectorAll('#helpTopicsList a');
    const helpContent = document.getElementById('helpContent');
    
    helpLinks.forEach(link => {
        link.addEventListener('click', async function(e) {
            e.preventDefault();
            
            // Update active state
            helpLinks.forEach(l => l.classList.remove('active'));
            this.classList.add('active');
            
            const topic = this.getAttribute('data-topic');
            
            // Show loading
            helpContent.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-muted">Loading help content...</p>
                </div>
            `;
            
            // Fetch help content
            try {
                const response = await fetch(`/help/contextual/?page=${topic}`);
                const data = await response.json();
                
                if (data.title) {
                    helpContent.innerHTML = `
                        <div class="help-article">
                            <h5 class="text-primary">
                                <i class="fas fa-question-circle me-2"></i>${data.title}
                            </h5>
                            <div class="mt-3">
                                <p class="text-muted">${data.content}</p>
                                <a href="${data.url}" class="btn btn-sm btn-primary mt-2">
                                    Read Full Article <i class="fas fa-arrow-right ms-1"></i>
                                </a>
                            </div>
                            <div class="mt-4 pt-3 border-top">
                                <small class="text-muted">
                                    <i class="fas fa-thumbs-up me-2"></i>Was this helpful?
                                    <button class="btn btn-sm btn-outline-success ms-2" onclick="markHelpful(${data.topic_id})">
                                        <i class="fas fa-check"></i> Yes
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger ms-2" onclick="markNotHelpful(${data.topic_id})">
                                        <i class="fas fa-times"></i> No
                                    </button>
                                </small>
                            </div>
                        </div>
                    `;
                } else {
                    helpContent.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-search fa-3x text-muted mb-3"></i>
                            <h5>No help articles found</h5>
                            <p class="text-muted">Try searching for your question above.</p>
                            <form action="/help/search/" method="get" class="mt-3">
                                <div class="input-group">
                                    <input type="text" class="form-control" name="q" placeholder="Search...">
                                    <button class="btn btn-primary" type="submit">Search</button>
                                </div>
                            </form>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading help content:', error);
                helpContent.innerHTML = `
                    <div class="text-center py-5 text-danger">
                        <i class="fas fa-exclamation-circle fa-3x mb-3"></i>
                        <h5>Error loading help content</h5>
                        <p>Please try again or contact support.</p>
                        <button class="btn btn-sm btn-outline-primary mt-2" onclick="location.reload()">
                            <i class="fas fa-sync-alt"></i> Retry
                        </button>
                    </div>
                `;
            }
        });
    });
});

// Mark help as helpful
function markHelpful(topicId) {
    fetch(`/help/feedback/${topicId}/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ was_helpful: true })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showNotification('Thank you for your feedback!', 'success');
        }
    })
    .catch(error => console.error('Error:', error));
}

// Mark help as not helpful
function markNotHelpful(topicId) {
    const comment = prompt('What could we improve? (Optional)');
    fetch(`/help/feedback/${topicId}/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ 
            was_helpful: false,
            comment: comment 
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showNotification('Thank you for helping us improve!', 'info');
        }
    })
    .catch(error => console.error('Error:', error));
}

// Helper function to get CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Show notification
function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
    notification.style.top = '20px';
    notification.style.right = '20px';
    notification.style.zIndex = '9999';
    notification.style.minWidth = '300px';
    notification.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.remove();
    }, 3000);
}
</script>
