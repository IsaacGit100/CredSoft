{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-warning">
            <h4>Update Status for Investment #{{ investment.certificate_no }}</h4>
        </div>
        <div class="card-body">
            <p><strong>Bank:</strong> {{ investment.get_bank_company_display }} | <strong>Amount:</strong> ₵{{ investment.amount|intcomma }}</p>
            <hr>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Save Changes</button>
                <a href="{% url 'InvestApp:investment_status_update' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
