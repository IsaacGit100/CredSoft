<!-- templates/bank_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank List</title>
    <!-- Bootstrap CSS (optional but recommended for form styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Bank List</h1>
        
        <!-- Add New Bank Button -->
        <a href="{% url 'InvestApp:bank_create' %}" class="btn btn-primary mb-3">Add New Bank</a>
        <a href="{% url 'InvestApp:investment_list' %}" class="btn btn-primary mb-3">Back</a>
        
        <!-- Banks Table -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Sort Code</th>
                    <th>BIC Code</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for bank in banks %}
                <tr>
                    <td>{{ bank.name }}</td>
                    <td>{{ bank.branch }}</td>
                    <td>{{ bank.sort_code }}</td>
                    <td>{{ bank.bic_code }}</td>
                    <td>
                        <a href="{% url 'InvestApp:bank_update' bank.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{% url 'InvestApp:bank_delete' bank.pk %}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="text-center">No banks found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
