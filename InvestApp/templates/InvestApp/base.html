<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Investment Tracking System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #e6f7ff;
            color: #0000ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 120, 255, 0.3);
        }
        h1, h2 {
            color: #0000ff;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .card {
            border: 2px solid #0000ff;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #f0f8ff;
        }
        .card-header {
            background-color: #0000ff;
            color: white;
            font-weight: bold;
        }
        .form-label {
            font-weight: 600;
            color: #0000ff;
        }
        .btn-primary {
            background-color: #0000ff;
            border-color: #0000ff;
        }
        .btn-primary:hover {
            background-color: #0000cc;
            border-color: #0000cc;
        }
        .summary-box {
            background-color: #0000ff;
            color: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .investment-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .investment-table th {
            background-color: #0000ff;
            color: white;
            padding: 10px;
            text-align: left;
        }
        .investment-table td {
            padding: 10px;
            border-bottom: 1px solid #0000ff;
        }
        .investment-table tr:hover {
            background-color: #e6f7ff;
        }
        .totals-row {
            font-weight: bold;
            background-color: #cce5ff;
        }
        .filter-section {
            background-color: #e6f7ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #0000ff;
        }
        .positive-interest {
            color: #006400;
            font-weight: bold;
        }
        .nav-tabs .nav-link {
            color: #0000ff;
        }
        .nav-tabs .nav-link.active {
            color: #0000ff;
            font-weight: bold;
            background-color: #e6f7ff;
            border-bottom: 3px solid #0000ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-chart-line me-2"></i>Investment Tracking System</h1>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
